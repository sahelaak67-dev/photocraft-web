name: Auto-Deploy Complete ArtCraft Web Suite

on:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '0 * * * *' # Checks for updates every single hour
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Download & Extract All Craft Web Apps
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist temp_zip

          # List of apps to fetch WebAssembly builds for:
          APPS=("photocraft" "vectorcraft" "filmcraft" "lightcraft" "effectcraft" "pdfcraft" "gridcraft" "wordcraft" "cadcraft" "designcraft")

          for APP in "${APPS[@]}"; do
            echo "Fetching latest web release for $APP..."
            mkdir -p "dist/$APP" "temp_zip/$APP"
            # Attempt to download web zip if available in latest release
            gh release download --repo "storytold/$APP" --pattern "*web*.zip" --dir "temp_zip/$APP" 2>/dev/null || true
            
            if ls temp_zip/$APP/*.zip 1> /dev/null 2>&1; then
              unzip -q temp_zip/$APP/*.zip -d "dist/$APP"
              
              # Flatten if nested in a subfolder
              if [ ! -f "dist/$APP/index.html" ]; then
                SUBDIR=$(find "dist/$APP" -mindepth 1 -maxdepth 1 -type d | head -n 1)
                if [ -n "$SUBDIR" ] && [ -f "$SUBDIR/index.html" ]; then
                  mv "$SUBDIR"/* "dist/$APP/"
                fi
              fi

              # Fix subpath snippets issue
              if [ -d "dist/$APP/snippets" ]; then
                mkdir -p "dist/$APP/app/snippets"
                cp -r "dist/$APP/snippets"/* "dist/$APP/app/snippets/" 2>/dev/null || true
              fi
            fi
          done

          # Disable Jekyll for the entire site (enables .part-aa chunks and WASM across all apps)
          touch dist/.nojekyll

          # Generate the Master Portal Landing Page
          cat << 'EOF' > dist/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>ArtCraft Web Suite • Open Source & Pure Rust</title>
            <link rel="preconnect" href="https://fonts.googleapis.com">
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
            <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
            <style>
              :root {
                --bg: #090c10;
                --surface: #111620;
                --border: #212633;
                --text: #f0f6fc;
                --muted: #8b949e;
                --accent-blue: #388bfd;
                --accent-purple: #a371f7;
                --card-hover: #161c28;
              }
              * { box-sizing: border-box; margin: 0; padding: 0; }
              body {
                background-color: var(--bg);
                color: var(--text);
                font-family: 'Inter', -apple-system, sans-serif;
                line-height: 1.5;
                padding-bottom: 60px;
              }
              header {
                max-width: 1200px;
                margin: 0 auto;
                padding: 60px 20px 30px;
                text-align: center;
              }
              .badge {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                background: rgba(56, 139, 253, 0.15);
                border: 1px solid rgba(56, 139, 253, 0.4);
                color: var(--accent-blue);
                font-size: 0.85rem;
                font-weight: 600;
                padding: 6px 14px;
                border-radius: 999px;
                margin-bottom: 16px;
                font-family: 'JetBrains Mono', monospace;
              }
              h1 {
                font-size: clamp(2.2rem, 5vw, 3.5rem);
                font-weight: 800;
                letter-spacing: -0.03em;
                background: linear-gradient(135deg, #ffffff 30%, #8b949e 100%);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                margin-bottom: 14px;
              }
              p.lead {
                color: var(--muted);
                font-size: 1.15rem;
                max-width: 720px;
                margin: 0 auto 30px;
              }
              .controls {
                max-width: 1200px;
                margin: 0 auto 30px;
                padding: 0 20px;
                display: flex;
                flex-wrap: wrap;
                gap: 14px;
                justify-content: space-between;
                align-items: center;
              }
              .search-box {
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 8px;
                padding: 10px 16px;
                color: #fff;
                font-size: 0.95rem;
                width: 100%;
                max-width: 320px;
              }
              .search-box:focus {
                outline: none;
                border-color: var(--accent-blue);
              }
              .filters {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
              }
              .filter-btn {
                background: var(--surface);
                border: 1px solid var(--border);
                color: var(--muted);
                padding: 6px 14px;
                border-radius: 8px;
                font-size: 0.85rem;
                font-weight: 500;
                cursor: pointer;
                transition: all 0.15s ease;
              }
              .filter-btn.active, .filter-btn:hover {
                background: #1c2333;
                color: #fff;
                border-color: #384152;
              }
              .grid {
                max-width: 1200px;
                margin: 0 auto;
                padding: 0 20px;
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
                gap: 20px;
              }
              .card {
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 14px;
                padding: 24px;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                transition: all 0.2s ease;
              }
              .card:hover {
                transform: translateY(-3px);
                border-color: #384152;
                background: var(--card-hover);
              }
              .card-header {
                display: flex;
                align-items: center;
                gap: 14px;
                margin-bottom: 12px;
              }
              .icon-box {
                width: 44px;
                height: 44px;
                border-radius: 10px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-weight: 800;
                font-size: 1.1rem;
              }
              .card-title h3 {
                font-size: 1.15rem;
                font-weight: 700;
              }
              .card-title span {
                font-size: 0.8rem;
                color: var(--muted);
                display: block;
              }
              .desc {
                font-size: 0.9rem;
                color: #c9d1d9;
                margin-bottom: 18px;
                flex-grow: 1;
              }
              .card-actions {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                justify-content: space-between;
                gap: 10px;
                border-top: 1px solid rgba(255,255,255,0.06);
                padding-top: 14px;
              }
              .btn-launch {
                background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
                color: #fff;
                font-weight: 600;
                font-size: 0.85rem;
                padding: 8px 14px;
                border-radius: 8px;
                text-decoration: none;
                display: inline-flex;
                align-items: center;
                gap: 6px;
                transition: all 0.2s ease;
              }
              .btn-launch:hover {
                box-shadow: 0 4px 15px rgba(56, 139, 253, 0.4);
                transform: translateY(-1px);
              }
              .card-links {
                display: flex;
                gap: 12px;
              }
              .card-link {
                font-size: 0.85rem;
                font-weight: 500;
                text-decoration: none;
                color: var(--muted);
              }
              .card-link:hover { color: #fff; text-decoration: underline; }
              footer {
                text-align: center;
                margin-top: 80px;
                font-size: 0.85rem;
                color: var(--muted);
              }
            </style>
          </head>
          <body>
            <header>
              <div class="badge">PURE RUST • RUNS 100% IN BROWSER • NO INSTALL</div>
              <h1>ArtCraft Web Suite</h1>
              <p class="lead">Open-source creative and productivity applications compiled to WebAssembly. Click any app below to launch it directly in your browser.</p>
            </header>

            <div class="controls">
              <input type="text" id="search" class="search-box" placeholder="Search apps or tools...">
              <div class="filters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="creative">Creative 2D</button>
                <button class="filter-btn" data-filter="video">Video & Audio</button>
                <button class="filter-btn" data-filter="3d">3D & CAD</button>
                <button class="filter-btn" data-filter="office">Documents</button>
              </div>
            </div>

            <main class="grid" id="appGrid"></main>

            <footer>
              <p>Powered by Storytold, Tangency Labs, and the Open Source Community • Updates hourly</p>
            </footer>

            <script>
              const apps = [
                { name: "PhotoCraft", target: "Adobe Photoshop", cat: "creative", color: "#31A8FF", bg: "rgba(49,168,255,0.15)", desc: "Layered raster editor with native CMYK, Curves, Levels, adjustment layers, and PSD support.", url: "./photocraft/", repo: "storytold/photocraft" },
                { name: "VectorCraft", target: "Adobe Illustrator", cat: "creative", color: "#FF9A00", bg: "rgba(255,154,0,0.15)", desc: "GPU-accelerated vector graphic design with Bézier path geometry, boolean cuts, and SVG export.", url: "./vectorcraft/", repo: "storytold/vectorcraft" },
                { name: "FilmCraft", target: "Adobe Premiere Pro", cat: "video", color: "#9999FF", bg: "rgba(153,153,255,0.15)", desc: "Non-linear video editor with integer time math, multi-track timelines, and three-way color grading.", url: "./filmcraft/", repo: "storytold/filmcraft" },
                { name: "LightCraft", target: "Adobe Lightroom", cat: "creative", color: "#31A8FF", bg: "rgba(49,168,255,0.15)", desc: "32-bit float scene-referred RAW darkroom with log-luminance recovery and 8-band color mixer.", url: "./lightcraft/", repo: "storytold/lightcraft" },
                { name: "EffectCraft", target: "Adobe After Effects", cat: "video", color: "#B388FF", bg: "rgba(179,136,255,0.15)", desc: "Motion graphics and visual effects compositor with keyframed value graphs and timeline buffers.", url: "./effectcraft/", repo: "storytold/effectcraft" },
                { name: "SolidCraft", target: "Fusion 360 / SolidWorks", cat: "3d", color: "#00B0FF", bg: "rgba(0,176,255,0.15)", desc: "3D parametric CAD with 2D sketch constraint solver, timeline feature tree, and sheet metal unbending.", url: "https://solidcraft.io", repo: "tangency-labs/solidcraft" },
                { name: "PdfCraft", target: "Adobe Acrobat Pro", cat: "office", color: "#FF2600", bg: "rgba(255,38,0,0.15)", desc: "Fast PDF object tree editor for page reordering, text redaction, annotations, and form fill.", url: "./pdfcraft/", repo: "storytold/pdfcraft" },
                { name: "GridCraft", target: "Microsoft Excel", cat: "office", color: "#217346", bg: "rgba(33,115,70,0.15)", desc: "Spreadsheet engine with precedent audit arrows, point-accurate formatting, and high-speed formulas.", url: "./gridcraft/", repo: "storytold/gridcraft" },
                { name: "WordCraft", target: "Microsoft Word", cat: "office", color: "#2B579A", bg: "rgba(43,87,154,0.15)", desc: "Document editor supporting DOCX tables, footnotes, margin rules, and offline spellchecking.", url: "./wordcraft/", repo: "storytold/wordcraft" },
                { name: "CADCraft", target: "Autodesk AutoCAD 2D", cat: "3d", color: "#D50000", bg: "rgba(213,0,0,0.15)", desc: "2D precision drafting and architectural drafting with AutoLISP prompt support and native DXF.", url: "./cadcraft/", repo: "storytold/cadcraft" },
                { name: "DesignCraft", target: "Adobe InDesign", cat: "creative", color: "#FF3366", bg: "rgba(255,51,102,0.15)", desc: "Desktop publishing with threaded text frames, multi-page master spreads, and preflight checks.", url: "./designcraft/", repo: "storytold/designcraft" }
              ];

              const grid = document.getElementById('appGrid');
              const searchInput = document.getElementById('search');
              const filterBtns = document.querySelectorAll('.filter-btn');

              function render(items) {
                grid.innerHTML = items.map(app => `
                  <article class="card">
                    <div>
                      <div class="card-header">
                        <div class="icon-box" style="color: ${app.color}; background: ${app.bg}">${app.name.charAt(0)}</div>
                        <div class="card-title">
                          <h3>${app.name}</h3>
                          <span>vs. ${app.target}</span>
                        </div>
                      </div>
                      <p class="desc">${app.desc}</p>
                    </div>
                    <div class="card-actions">
                      <a href="${app.url}" class="btn-launch">⚡ Launch Web App</a>
                      <div class="card-links">
                        <a href="https://github.com/${app.repo}" class="card-link" target="_blank">GitHub</a>
                        <a href="https://github.com/${app.repo}/releases" class="card-link" target="_blank">Releases</a>
                      </div>
                    </div>
                  </article>
                `).join('');
              }

              function filterApps() {
                const term = searchInput.value.toLowerCase();
                const activeCat = document.querySelector('.filter-btn.active').dataset.filter;
                const filtered = apps.filter(app => {
                  const matchesSearch = app.name.toLowerCase().includes(term) || app.target.toLowerCase().includes(term) || app.desc.toLowerCase().includes(term);
                  const matchesCat = (activeCat === 'all') || (app.cat === activeCat);
                  return matchesSearch && matchesCat;
                });
                render(filtered);
              }

              searchInput.addEventListener('input', filterApps);
              filterBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                  filterBtns.forEach(b => b.classList.remove('active'));
                  btn.classList.add('active');
                  filterApps();
                });
              });

              render(apps);
            </script>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
