name: Auto-Deploy Latest PhotoCraft Web

on:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Download & Extract Latest Web Build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist temp_zip
          gh release download --repo storytold/photocraft --pattern "photocraft-web-*.zip" --dir temp_zip
          unzip -q temp_zip/*.zip -d dist
          
          # 1. Ensure index.html is at the root of dist
          if [ ! -f dist/index.html ]; then
            SUBDIR=$(find dist -mindepth 1 -maxdepth 1 -type d | head -n 1)
            if [ -n "$SUBDIR" ] && [ -f "$SUBDIR/index.html" ]; then
              mv "$SUBDIR"/* dist/
            fi
          fi

          # 2. Disable Jekyll so GitHub Pages allows .part-aa chunks and WASM files
          touch dist/.nojekyll

          # 3. Fix Issue #10092 (subpath snippets folder resolution)
          if [ -d dist/snippets ]; then
            mkdir -p dist/app/snippets
            cp -r dist/snippets/* dist/app/snippets/ 2>/dev/null || true
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
